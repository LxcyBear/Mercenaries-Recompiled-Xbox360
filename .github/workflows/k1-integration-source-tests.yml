name: K1 integration source self-tests

on:
  push:
    branches:
      - xbox360/phase6-native-graphics
    paths:
      - "ports/mercenaries/xbox360/integration_map/k1/**"
      - ".github/workflows/k1-integration-source-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax check — all K1 stages
        run: python -m compileall -q ports/mercenaries/xbox360/integration_map/k1
      - name: 64-shard declaration/body scanner regression
        run: python ports/mercenaries/xbox360/integration_map/k1/Audit-K1ThreeLaneFrontiers.py --self-test
      - name: Three-lane runtime stage regression
        run: python ports/mercenaries/xbox360/integration_map/k1/Stage-K1ThreeLaneMain.py --self-test
      - name: DAC indexed palette regression
        run: python ports/mercenaries/xbox360/integration_map/k1/Stage-K1NV2ADacPalette.py --self-test
      - name: Genuine 0017A0A0 text-direct pack regression (no XBE)
        run: |
          python ports/mercenaries/xbox360/integration_map/k1/Stage-K1TextDirectBatch.py --self-test \
            --base-module ports/mercenaries/xbox360/phase4c_native_startup/emit_phase4c_startup_slice.py \
            --p5bb-module ports/mercenaries/xbox360/phase5_subsystem_bringup/emit_phase5bb_frontier22dda4.py \
            --p5bc-module ports/mercenaries/xbox360/phase5_subsystem_bringup/emit_phase5bc_broad_sweep.py \
            --pc-manual ports/mercenaries/src/recomp_manual.c
      - name: K1 second retail CreateDevice source-only safety fixtures
        run: python ports/mercenaries/xbox360/integration_map/k1/Stage-K1D3DSecondCreateDevice.py --self-test
      - name: K1 authentic D3D 00289E20 mandatory frontier source fixtures
        run: python ports/mercenaries/xbox360/integration_map/k1/Stage-K1D3DDirect289E20.py --self-test
      - name: K1 D3D predictive-batch source-only fixtures
        run: python ports/mercenaries/xbox360/integration_map/k1/Plan-K1D3DBatch.py --self-test
      - name: Offline Watson compact view safety regression
        run: python ports/mercenaries/xbox360/integration_map/k1/Compact-K1Watson.py --self-test
      - name: Quiet logger external ABI and restage regression
        run: python ports/mercenaries/xbox360/integration_map/k1/Stage-K1DQQuietLogging.py --self-test

  ps51-parser-gates:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Parse K1 D3D direct runner with Windows PowerShell 5.1
        shell: powershell
        run: |
          $path = Resolve-Path ".\ports\mercenaries\xbox360\integration_map\k1\Advance-K1D3DDirect289E20.ps1"
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($path.Path, [ref]$tokens, [ref]$errors)
          if (@($errors).Count -ne 0) {
              $errors | ForEach-Object { Write-Host $_ }
              throw "K1D3D PowerShell 5.1 parse failed"
          }
          $source = Get-Content -LiteralPath $path.Path -Raw -Encoding UTF8
          $buildCount = [regex]::Matches($source, '(?m)^& \$builder @buildArgs\s*$').Count
          $hashCount = [regex]::Matches($source, "(?m)^\s*-not \(\`$doc\.pc_support_proof\.pc_.*_sha256 -match ").Count
          $guardCount = [regex]::Matches($source, '(?m)^if\(-not \$Build\)\{').Count
          if ($buildCount -ne 1 -or $hashCount -ne 2 -or $guardCount -ne 1) {
              throw "K1D3D duplicated/truncated stage: build=$buildCount hash=$hashCount source-only-guard=$guardCount"
          }
          Write-Host "[PS51] PASS: real parser; one build, two complete hash checks, source-only gate intact"
      - name: Parse source-only predictive D3D batch planner on Windows PowerShell 5.1
        shell: powershell
        run: |
          $path = Resolve-Path ".\ports\mercenaries\xbox360\integration_map\k1\Plan-K1D3DBatch.ps1"
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($path.Path, [ref]$tokens, [ref]$errors)
          if (@($errors).Count -ne 0) {
              $errors | ForEach-Object { Write-Host $_ }
              throw "K1 D3D predictive batch PowerShell 5.1 parse failed"
          }
          $source = Get-Content -LiteralPath $path.Path -Raw -Encoding UTF8
          if ($source.Contains('& $builder') -or $source.Contains('Invoke-VS17Xbox360Build.ps1') -or
              -not $source.Contains('Plan-K1D3DBatch.py') -or
              -not $source.Contains('safe_to_build -ne $false')) {
              throw "K1D3D source-only planner added unsafe build operation"
          }
          Write-Host "[PS51] PASS: predictive batch source-only; no XDK invocation"

