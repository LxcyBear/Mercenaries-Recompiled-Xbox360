      - name: Parse one-build original 002228C0 r5 source stage on Windows PowerShell 5.1
        shell: powershell
        run: |
          $path = Resolve-Path ".\ports\mercenaries\xbox360\integration_map\k1\Advance-K1PostTwoRootDirect.ps1"
